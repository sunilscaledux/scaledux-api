
# -------- scaledux.com → Main Website (/var/www/website) --------
server {
    listen 80;
    server_name scaledux.com www.scaledux.com;

    root /var/www/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -------- app.scaledux.com → Frontend (Port 3000) --------
server {
    listen 80;
    server_name app.scaledux.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# -------- api.scaledux.com → Backend API (Port 4000) --------
server {
    listen 80;
    server_name api.scaledux.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 50M;
    }
}

# -------- socket.scaledux.com → Socket Server (Port 4001) --------
server {
    listen 80;
    server_name socket.scaledux.com;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4001/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
    }
}
