# ScaleDux — DEV: full stack (Postgres + Redis + API + Socket + Worker + Schedule + Frontend)
# Run from scaleDux-api:  docker compose up -d --build
#
# Migrations run automatically when the api container starts (prisma migrate deploy).
#
# URLs when running locally:
#   Frontend:  http://localhost:3000
#   API:       http://localhost:4000/api/v1
#   Socket:    http://localhost:4001
#   Schedule:  (cron process, no HTTP port)

services:
  postgres:
    image: postgres:18-alpine
    container_name: scaledux-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 12345678
      POSTGRES_USER: postgres
      POSTGRES_DB: scaledux
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scaledux"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scaledux-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: scaledux-api
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && npm run dev"]
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  socket:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-socket
    container_name: scaledux-socket
    restart: unless-stopped
    ports:
      - "4001:4001"
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-worker
    container_name: scaledux-worker
    restart: unless-stopped
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-schedule
    container_name: scaledux-schedule
    restart: unless-stopped
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - ./.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

      #comment if not needed maily while foing only backend development

  frontend:
    build:
      context: ../scaledux-ui
      dockerfile: Dockerfile
      target: dev
    container_name: scaledux-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    volumes:
      - ../scaledux-ui:/app
      - scaledux_ui_node_modules:/app/node_modules
    env_file: ../scaledux-ui/.env
    depends_on:
      - api

volumes:
  postgres_data:
  scaledux_api_node_modules:
  scaledux_ui_node_modules:
