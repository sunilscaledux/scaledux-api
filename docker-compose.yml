# Backend dev: from this folder → docker compose up
# Set DATABASE_URL host to `postgres`, REDIS_URL to `redis://redis:6379` in .env for Docker.

services:
  postgres:
    image: postgres:18-alpine
    container_name: scaledux-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: 12345678
      POSTGRES_USER: postgres
      POSTGRES_DB: scaledux
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scaledux"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: scaledux-app
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev:docker"]
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      postgres: { condition: service_healthy }

  socket:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-socket
    container_name: scaledux-socket
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npm run dev:socket"]
    ports:
      - "4001:4001"
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-worker
    container_name: scaledux-worker
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npm run dev:worker"]
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }

  message-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-message-worker
    container_name: scaledux-message-worker
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npm run dev:message-worker"]
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-schedule
    container_name: scaledux-schedule
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma generate && npm run dev:schedule"]
    volumes:
      - .:/app
      - scaledux_api_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }

volumes:
  postgres_data:
  scaledux_api_node_modules:
