<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      line-height: 1.6; 
      color: #333; 
      margin: 0; 
      padding: 0; 
      background-color: #f4f4f4; 
    }
    .container { 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 20px; 
      background-color: #ffffff; 
    }
    .header { 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      color: white; 
      padding: 30px; 
      text-align: center; 
      border-radius: 10px 10px 0 0; 
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .content { 
      background: #f9f9f9; 
      padding: 30px; 
      border-radius: 0 0 10px 10px; 
    }
    .content h2 {
      color: #333;
      margin-top: 0;
    }
    .otp-code { 
      background: #667eea; 
      color: white; 
      font-size: 32px; 
      font-weight: bold; 
      padding: 20px; 
      text-align: center; 
      border-radius: 8px; 
      letter-spacing: 5px; 
      margin: 20px 0; 
    }
    .button { 
      display: inline-block; 
      background: #667eea; 
      color: white; 
      padding: 12px 30px; 
      text-decoration: none; 
      border-radius: 5px; 
      margin: 20px 0; 
      font-weight: bold;
    }
    .footer { 
      text-align: center; 
      margin-top: 20px; 
      color: #666; 
      font-size: 14px; 
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
    .footer strong {
      color: #333;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{HEADER_TITLE}}</h1>
    </div>
    <div class="content">
      {{CONTENT}}
      
      <div class="footer">
        <p>{{FOOTER_MESSAGE}}<br><strong>{{COMPANY_NAME}}</strong></p>
        <p><small>{{FOOTER_NOTE}}</small></p>
      </div>
    </div>
  </div>
</body>
</html>
