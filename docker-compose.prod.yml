# ScaleDux — PROD: app services only (external Postgres + Redis)
# Expected layout under /var/www:
#   /var/www/backend
#   /var/www/frontend
# Set POSTGRES_URL, REDIS_HOST, REDIS_PORT, REDIS_PASSWORD in /var/www/backend/.env
#
# Run from /var/www:
#   docker compose -f backend/docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-api
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env

  socket:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-socket
    restart: unless-stopped
    command: ["node", "dist/socket-server.js"]
    ports:
      - "4001:4001"
    env_file:
      - ./backend/.env

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-worker
    restart: unless-stopped
    command: ["node", "dist/workerServer.js"]
    env_file:
      - ./backend/.env

  schedule:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-schedule
    restart: unless-stopped
    command: ["node", "dist/scheduleServer.js"]
    env_file:
      - ./backend/.env

  # Comment this service if frontend is deployed separately.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./frontend/.env
    depends_on:
      - api
