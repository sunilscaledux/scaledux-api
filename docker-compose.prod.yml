# ScaleDux — PROD: app services only (external Postgres + Redis)
# Set POSTGRES_URL, REDIS_HOST, REDIS_PORT, REDIS_PASSWORD in scaleDux-api/.env
#
# Run from repo root:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: ./scaleDux-api
      dockerfile: Dockerfile
      target: prod
    image: scaledux-api:prod
    container_name: scaledux-api
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]
    ports:
      - "4000:4000"
    env_file:
      - ./scaleDux-api/.env
      - ./.env.docker.prod

  socket:
    build:
      context: ./scaleDux-api
      dockerfile: Dockerfile
      target: prod
    image: scaledux-api:prod
    container_name: scaledux-socket
    restart: unless-stopped
    command: ["node", "dist/socket-server.js"]
    ports:
      - "4001:4001"
    env_file:
      - ./scaleDux-api/.env
      - ./.env.docker.prod

  worker:
    build:
      context: ./scaleDux-api
      dockerfile: Dockerfile
      target: prod
    image: scaledux-api:prod
    container_name: scaledux-worker
    restart: unless-stopped
    command: ["node", "dist/workerServer.js"]
    env_file:
      - ./scaleDux-api/.env
      - ./.env.docker.prod

  schedule:
    build:
      context: ./scaleDux-api
      dockerfile: Dockerfile
      target: prod
    image: scaledux-api:prod
    container_name: scaledux-schedule
    restart: unless-stopped
    command: ["node", "dist/scheduleServer.js"]
    env_file:
      - ./scaleDux-api/.env
      - ./.env.docker.prod

      #comment if not needed maily while foing only backend development
  frontend:
    build:
      context: ./scaledux-ui
      dockerfile: Dockerfile
      target: prod
    image: scaledux-ui:prod
    container_name: scaledux-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./.env.docker.prod
    depends_on:
      - api
