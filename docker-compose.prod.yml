
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: scaledux-api
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && exec node dist/server.js"]
    ports:
      - "4000:4000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-admin
    container_name: scaledux-admin
    restart: unless-stopped
    command: ["node", "dist/adminServer.js"]
    ports:
      - "4002:4002"
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  socket:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-socket
    container_name: scaledux-socket
    restart: unless-stopped
    command: ["node", "dist/socket-server.js"]
    ports:
      - "4001:4001"
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-worker
    container_name: scaledux-worker
    restart: unless-stopped
    command: ["node", "dist/workerServer.js"]
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  message-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-message-worker
    container_name: scaledux-message-worker
    restart: unless-stopped
    command: ["node", "dist/workers/MessageWorker.js"]
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod-schedule
    container_name: scaledux-schedule
    restart: unless-stopped
    command: ["node", "dist/scheduleServer.js"]
    env_file:
      - .env
    depends_on:
      app: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"
